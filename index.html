<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이강민 | 자기소개</title>
<style>
  :root {
    --teal: #5cd3e8;
    --teal-soft: #eafbfd;
    --teal-mid: #b8ecf3;
    --navy: #26424d;
    --navy-deep: #1b2f38;
    --text: #1b2f38;
    --sub: #4d6672;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 45%, var(--teal) 130%);
  }
  .deco {
    position: fixed;
    font-size: 26px;
    opacity: 0.55;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, var(--teal-soft) 0%, var(--teal-mid) 100%);
    border: 4px solid var(--navy);
    border-radius: 22px;
    padding: 44px 36px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 12px 36px rgba(0,0,0,0.35);
    text-align: center;
    z-index: 2;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    margin: 0 auto 20px;
    border: 4px solid var(--navy);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 30px;
    font-weight: 900;
    color: var(--teal);
    -webkit-text-stroke: 1.5px var(--navy);
    text-stroke: 1.5px var(--navy);
    letter-spacing: 0.01em;
  }
  .dept {
    color: var(--navy);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 22px;
  }
  .tagline {
    font-size: 16px;
    font-weight: 800;
    color: var(--teal);
    -webkit-text-stroke: 0.6px var(--navy);
    background: var(--navy);
    border-radius: 10px;
    padding: 11px 16px;
    margin-bottom: 26px;
    letter-spacing: 0.01em;
  }
  .section-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: left;
  }
  .likes {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .likes li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    padding: 13px 16px;
    background: linear-gradient(135deg, #ffffff, var(--teal-soft));
    border: 2px solid var(--navy);
    border-radius: 10px;
  }
  .likes .num {
    font-weight: 900;
    color: var(--navy-deep);
    background: var(--teal);
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    border: 1.5px solid var(--navy);
  }
  .likes li.fromis {
    background: linear-gradient(135deg, #d8f2f6, #7fd4e6);
    border-width: 3px;
    box-shadow: 0 0 0 3px rgba(92, 211, 232, 0.35);
  }
  .likes li.fromis .label {
    font-weight: 900;
    color: var(--teal);
    -webkit-text-stroke: 1px var(--navy);
    text-stroke: 1px var(--navy);
    letter-spacing: 0.02em;
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--sub);
  }
</style>
</head>
<body>
  <div class="deco" style="left:8%; top:12%;">💙</div>
  <div class="deco" style="right:9%; top:18%;">💙</div>
  <div class="deco" style="left:10%; bottom:10%;">💙</div>
  <div class="deco" style="right:8%; bottom:12%;">💙</div>

  <div class="card">
    <div class="avatar">강</div>
    <h1>이강민</h1>
    <div class="dept">SCM팀 · 자재파트</div>
    <div class="tagline">스윗 스윗 화이팅!</div>

    <div class="section-title">좋아하는 것</div>
    <ul class="likes">
      <li class="fromis"><span class="num">1</span> <span class="label">프로미스나인</span> 💙</li>
      <li><span class="num">2</span> 고민중독 부르기</li>
      <li><span class="num">3</span> 스윗밸런스랩 자랑하기</li>
    </ul>

    <footer>Made with GitHub Pages</footer>
  </div>
</body>
</html>
