<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이강민 | 자기소개</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #222222;
    --sub: #6b6b6b;
    --accent: #3a7d5c;
    --border: #e5e5e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    text-align: center;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 20px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
  }
  .dept {
    color: var(--sub);
    font-size: 15px;
    margin-bottom: 24px;
  }
  .tagline {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(58,125,92,0.08);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 28px;
  }
  .section-title {
    font-size: 13px;
    color: var(--sub);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: left;
  }
  .likes {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .likes li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
  }
  .likes .num {
    font-weight: 700;
    color: var(--accent);
    min-width: 18px;
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--sub);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">강</div>
    <h1>이강민</h1>
    <div class="dept">SCM팀 · 자재파트</div>
    <div class="tagline">스윗 스윗 화이팅!</div>

    <div class="section-title">좋아하는 것</div>
    <ul class="likes">
      <li><span class="num">1</span> 프로미스나인</li>
      <li><span class="num">2</span> 고민중독 부르기</li>
      <li><span class="num">3</span> 스윗밸런스랩 자랑하기</li>
    </ul>

    <footer>Made with GitHub Pages</footer>
  </div>
</body>
</html>
