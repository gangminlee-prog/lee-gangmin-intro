<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이강민 | 자기소개</title>
<style>
  :root {
    --green-dark: #2f5d4a;
    --green: #4c8c6e;
    --green-soft: #dcebe1;
    --beige: #f3ead9;
    --beige-deep: #e8dbc0;
    --text: #2f3d34;
    --sub: #5f6d63;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
    background: linear-gradient(180deg,
      #bfe8f5 0%,
      #8fd3e8 22%,
      #4fb3d9 42%,
      #2e93c2 58%,
      #ead9ae 58%,
      #f1e4bf 100%
    );
  }
  .sun {
    position: fixed;
    top: 48px;
    right: 48px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6cf, #ffd75e 70%);
    box-shadow: 0 0 40px 10px rgba(255, 220, 120, 0.5);
  }
  .waves {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 42%;
    height: 60px;
    background-repeat: repeat-x;
    background-size: 120px 60px;
    background-image:
      radial-gradient(circle at 30px 0, transparent 24px, rgba(255,255,255,0.55) 25px, rgba(255,255,255,0.55) 27px, transparent 28px);
    opacity: 0.8;
  }
  .waves.two { bottom: 35%; opacity: 0.5; background-size: 100px 50px; }
  .deco {
    position: fixed;
    font-size: 28px;
    opacity: 0.9;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, var(--beige) 0%, var(--beige-deep) 100%);
    border: 3px solid var(--green);
    border-radius: 20px;
    padding: 44px 36px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 34px rgba(20, 60, 45, 0.25);
    text-align: center;
    z-index: 2;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--green-dark);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 20px;
    border: 3px solid var(--beige);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 27px;
    font-weight: 800;
    color: var(--green-dark);
  }
  .dept {
    color: var(--sub);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 22px;
  }
  .tagline {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    background: var(--green);
    border-radius: 10px;
    padding: 11px 16px;
    margin-bottom: 26px;
    letter-spacing: 0.01em;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: left;
  }
  .likes {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .likes li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    padding: 13px 16px;
    background: var(--green-soft);
    border: 1px solid rgba(76, 140, 110, 0.35);
    border-radius: 10px;
  }
  .likes .num {
    font-weight: 800;
    color: #ffffff;
    background: var(--green-dark);
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--sub);
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="waves"></div>
  <div class="waves two"></div>
  <div class="deco" style="left:6%; top:14%;">☀️</div>
  <div class="deco" style="left:10%; bottom:8%;">🐚</div>
  <div class="deco" style="right:8%; bottom:10%;">🌴</div>
  <div class="deco" style="right:12%; top:20%;">🌊</div>

  <div class="card">
    <div class="avatar">강</div>
    <h1>이강민</h1>
    <div class="dept">SCM팀 · 자재파트</div>
    <div class="tagline">스윗 스윗 화이팅!</div>

    <div class="section-title">좋아하는 것</div>
    <ul class="likes">
      <li><span class="num">1</span> 프로미스나인</li>
      <li><span class="num">2</span> 고민중독 부르기</li>
      <li><span class="num">3</span> 스윗밸런스랩 자랑하기</li>
    </ul>

    <footer>Made with GitHub Pages</footer>
  </div>
</body>
</html>
